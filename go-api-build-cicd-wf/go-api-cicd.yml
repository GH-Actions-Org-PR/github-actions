name: Go API CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.22"
  MODULE: github.com/example/go-api

jobs:
  # ===========================================================================
  lint:
    name: Lint & vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt'd:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # ===========================================================================
  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run full test suite with race detector
        run: go test -race ./...

      # Coverage is enforced on internal/... only, not cmd/api. main()
      # is signal-handling/wiring glue (see cmd/api/main.go) that's meant
      # to be exercised by integration/smoke tests, not unit tests - mixing
      # it into the module-wide average punishes thin entrypoints instead
      # of measuring the logic that matters.
      - name: Coverage report (internal packages)
        run: go test -covermode=atomic -coverprofile=coverage.out ./internal/...

      - name: Enforce minimum coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "internal/... coverage: ${COVERAGE}%"
          THRESHOLD=70
          if awk "BEGIN {exit !($COVERAGE < $THRESHOLD)}"; then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 14

  # ===========================================================================
  security:
    name: Security & vuln scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: gosec SARIF scan
        uses: securego/gosec@master
        with:
          args: -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true

      - name: Upload gosec results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif

  # ===========================================================================
  # Cross-compiles a static binary for every OS/arch. CGO is disabled so
  # each leg needs nothing but the Go toolchain - no cross-compiler,
  # no per-platform runner required.
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve version metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME:-dev-$(git rev-parse --short HEAD)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: |
          mkdir -p dist
          EXT=""
          [ "${{ matrix.goos }}" = "windows" ] && EXT=".exe"
          go build -trimpath \
            -ldflags "-s -w \
              -X ${{ env.MODULE }}/internal/version.Version=${{ steps.meta.outputs.version }} \
              -X ${{ env.MODULE }}/internal/version.Commit=${{ steps.meta.outputs.commit }} \
              -X ${{ env.MODULE }}/internal/version.BuildDate=${{ steps.meta.outputs.date }}" \
            -o dist/api-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/api

      - name: Checksum
        run: |
          cd dist
          sha256sum * > ../checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.goos }}-${{ matrix.goarch }}
          path: checksums-${{ matrix.goos }}-${{ matrix.goarch }}.txt
          retention-days: 14

  # ===========================================================================
  docker:
    name: Build & push container image
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME:-dev-$(git rev-parse --short HEAD)}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: img
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.img.outputs.tags }}
          labels: ${{ steps.img.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  # ===========================================================================
  # Merges every per-platform artifact into one release bundle - the same
  # "download with pattern + merge-multiple" technique regardless of what
  # produced the artifacts.
  package:
    name: Package release bundle
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download and merge all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: api-*
          path: release/bin
          merge-multiple: true

      - name: Download and merge all checksums
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: release/checksums
          merge-multiple: true

      - name: Build combined checksum manifest
        run: |
          cat release/checksums/*.txt > release/bin/SHA256SUMS.txt
          rm -rf release/checksums

      - name: Create per-platform tarballs
        run: |
          cd release/bin
          for f in api-*; do
            [ "$f" = "SHA256SUMS.txt" ] && continue
            tar -czf "${f}-${{ steps.version.outputs.version }}.tar.gz" "$f" SHA256SUMS.txt
          done

      - name: Upload packaged bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.version.outputs.version }}
          path: release/bin/*.tar.gz
          retention-days: 90
          if-no-files-found: error

  # ===========================================================================
  release:
    name: Publish GitHub Release
    needs: [package, docker]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packaged bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ needs.package.outputs.version }}
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Container image: `ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.digest }}`

  # ===========================================================================
  deploy:
    name: Deploy to production
    needs: [package, docker, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://api.example.com
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Roll out new image
        run: |
          aws ecs update-service \
            --cluster go-api-production \
            --service go-api \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster go-api-production \
            --service go-api

      - name: Smoke test
        run: curl -sSf --retry 5 --retry-delay 5 https://api.example.com/healthz
