name: "Go Hello World"
author: "Preetu Sharma"
description: "Greet someone and record the time"

inputs:
  who-to-greet:
    description: "Who to greet"
    required: true
    default: "World"

outputs:
  time:
    description: "The time of the greeting"

runs:
  using: "docker"
  # Points at the Dockerfile in this same directory. GitHub builds the
  # image itself when the action runs - no need to push it to a
  # registry first. (The alternative, like your example, is
  # image: 'docker://some/published-image:tag' to pull a prebuilt one.)
  image: "Dockerfile"
  args:
    - ${{ inputs.who-to-greet }}
  # No `args:` needed - GitHub automatically injects every input as an
  # env var named INPUT_<NAME>, which is what main.go reads. `args:`
  # would additionally pass values as CLI arguments (os.Args) if you
  # preferred that style instead.
