name: Reusable Go Build

on:
  workflow_call:

    inputs:
      go-version:
        required: true
        type: string

      image-name:
        required: true
        type: string

    secrets:
      ghcr-token:
        required: true

    outputs:
      image-tag:
        description: Docker image tag
        value: ${{ jobs.build.outputs.image-tag }}

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.image.outputs.tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go-version }}

      - name: Download Modules
        run: go mod download

      - name: Run Tests
        run: go test ./...

      - name: Build Binary
        run: go build -o app .

      - name: Generate Image Tag
        id: image
        run: |
          IMAGE=${{ inputs.image-name }}:${GITHUB_SHA}
          echo "tag=$IMAGE" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        run: |
          echo "${{ secrets.ghcr-token }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker Image
        run: |
          docker build \
            -t "${{ steps.image.outputs.tag }}" .

      - name: Push Docker Image
        run: |
          docker push "${{ steps.image.outputs.tag }}"